name: Canvas Agent

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay schedules slightly.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run full cycle but never write to Canvas"
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: pip install .

      - name: Restore agent memory
        uses: dawidd6/action-download-artifact@v6
        with:
          name: agent-state
          path: data
          workflow: canvas-agent.yml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Run one cycle
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          PARLEY_MODEL: ${{ vars.PARLEY_MODEL }}
          CANVAS_COURSE_ID: ${{ vars.CANVAS_COURSE_ID }}
          CANVAS_TOPIC_ID: ${{ vars.CANVAS_TOPIC_ID }}
          CANVAS_AGENT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
        run: |
          mkdir -p data
          if [ -z "$PARLEY_MODEL" ]; then unset PARLEY_MODEL; fi
          if [ -z "$CANVAS_COURSE_ID" ]; then unset CANVAS_COURSE_ID; fi
          if [ -z "$CANVAS_TOPIC_ID" ]; then unset CANVAS_TOPIC_ID; fi
          python -m canvas_agent once

      - name: Save agent memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-state
          path: data/
          retention-days: 30
          if-no-files-found: warn
